<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>GohanOST — OwlSense Tactical</title>
<style>
:root{color-scheme:dark;--bg:#090e19;--panel:#111b2c;--line:#293750;--text:#edf3ff;--muted:#9baac2;--accent:#80e0c0;--blue:#78a9ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1b2c49 0%,#090e19 58%);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.shell{max-width:1700px;margin:auto;padding:22px 22px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:56px;height:56px;display:grid;place-items:center;flex:0 0 auto;border-radius:15px;background:linear-gradient(145deg,#80e0c0,#78a9ff);box-shadow:0 8px 24px #0004;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;padding:3px}
h1{font-size:clamp(25px,4vw,34px);line-height:1.05;margin:0;letter-spacing:-.04em}
.sub{margin:5px 0 0;color:var(--muted);font-size:12px}
.badge{border:1px solid #3d625e;background:#102522;color:var(--accent);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
.tab{display:flex;align-items:center;gap:11px;text-align:left;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#142138,#101827);color:var(--text);cursor:pointer;min-width:0;transition:.18s}
.tab:hover{border-color:#6684ad;transform:translateY(-1px)}
.tab[aria-selected=true]{border-color:var(--accent);background:linear-gradient(145deg,#18352f,#14243a);box-shadow:0 0 0 1px #80e0c022 inset}
.num{width:29px;height:29px;display:grid;place-items:center;flex:0 0 auto;border-radius:9px;background:#263751;color:var(--blue);font-weight:850}
.tab[aria-selected=true] .num{background:#28594e;color:#a6f1d7}
.tab strong{display:block;font-size:13px}
.tab small{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:normal}
.stage{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0b1220;box-shadow:0 16px 42px #0004}
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #26354b;background:#111b2b}
.stage-title{font-size:12px;font-weight:800;letter-spacing:.08em;color:#c8d7ed}
.stage-hint{font-size:11px;color:var(--muted)}
.frame{display:none;width:100%;height:calc(100vh - 220px);min-height:760px;border:0;background:#080d18}
.frame.active{display:block}
footer{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:#71829c;font-size:11px}
@media(max-width:700px){.shell{padding:14px 10px 22px}header{align-items:flex-start}.badge{font-size:9px;padding:6px 8px}.logo{width:44px;height:44px}.nav{grid-template-columns:1fr;gap:7px}.tab{padding:10px 12px}.tab small{font-size:10px}.frame{height:calc(100vh - 300px);min-height:700px}.stage-head{align-items:flex-start;flex-direction:column;gap:2px}}
</style>
</head>

const TITLES = {target:"01 / OST TARGET", analyzer:"02 / OST ANALYZER", simulator:"03 / OST SIMULATOR"};
const loaded = new Set();
function decodeBase64Utf8(value){
  const bytes=Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function loadTool(key){
  if(loaded.has(key)) return;
  const frame=document.getElementById("frame-"+key);
  frame.srcdoc=decodeBase64Utf8(SOURCES[key]);
  loaded.add(key);
}
function selectTool(key){
  document.querySelectorAll(".tab").forEach(tab=>tab.setAttribute("aria-selected",String(tab.dataset.tool===key)));
  document.querySelectorAll(".frame").forEach(frame=>frame.classList.toggle("active",frame.id==="frame-"+key));
  document.getElementById("activeTitle").textContent=TITLES[key];
  loadTool(key);
  try{localStorage.setItem("hanlab.activeTool",key)}catch(e){}
}
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>selectTool(tab.dataset.tool)));
let initial="target";
try{const saved=localStorage.getItem("hanlab.activeTool");if(TITLES[saved])initial=saved}catch(e){}
selectTool(initial);
</script>
